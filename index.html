<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JLPT N3→N2 Study App</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f0f1a; color: #e8e8f0; font-family: 'Segoe UI', sans-serif; }
    button { font-family: inherit; }
    textarea { font-family: inherit; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STORAGE_KEY = "jlpt_v3";
    function load() { try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : null; } catch { return null; } }
    function save(p) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch {} }
    function initProgress() {
      return { xp: 0, streak: 0, lastStudied: null, sectionXP: { Vocabulary: 0, Grammar: 0, Listening: 0, Reading: 0, Speaking: 0 }, mockScores: [] };
    }

    const SECTIONS = ["Dashboard", "Vocabulary", "Grammar", "Listening", "Reading", "Speaking", "Mock Exam"];
    const GEMINI_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent";

    async function askGemini(apiKey, prompt) {
      const res = await fetch(`${GEMINI_URL}?key=${apiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
      const clean = text.replace(/```json|```/g, "").trim();
      return JSON.parse(clean);
    }

    function Card({ children, style }) {
      return <div style={{ background: "#1a1a2e", border: "1px solid #2a2a4a", borderRadius: 12, padding: 20, marginBottom: 16, ...style }}>{children}</div>;
    }

    function Spinner() {
      return (
        <div style={{ textAlign: "center", padding: 40 }}>
          <div style={{ fontSize: 32, marginBottom: 12, animation: "spin 1s linear infinite", display: "inline-block" }}>🎌</div>
          <div style={{ color: "#7070a0" }}>Generating with Gemini AI...</div>
        </div>
      );
    }

    function ApiKeySetup({ onSave }) {
      const [key, setKey] = React.useState("");
      return (
        <div style={{ minHeight: "100vh", background: "#0f0f1a", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
          <div style={{ maxWidth: 480, width: "100%" }}>
            <div style={{ textAlign: "center", marginBottom: 32 }}>
              <div style={{ fontSize: 48, marginBottom: 12 }}>🎌</div>
              <h1 style={{ color: "#a78bfa", margin: "0 0 8px" }}>JLPT N3→N2</h1>
              <p style={{ color: "#7070a0", margin: 0 }}>AI-Powered Study App</p>
            </div>
            <Card>
              <div style={{ fontWeight: 700, fontSize: 16, marginBottom: 8 }}>Enter your Gemini API Key</div>
              <div style={{ color: "#7070a0", fontSize: 13, marginBottom: 16, lineHeight: 1.6 }}>
                Your key is stored only in your browser and never sent anywhere except Google's API directly. Get a free key at <a href="https://aistudio.google.com" target="_blank" style={{ color: "#a78bfa" }}>aistudio.google.com</a>.
              </div>
              <input
                type="password"
                value={key}
                onChange={e => setKey(e.target.value)}
                placeholder="AIza..."
                style={{ width: "100%", padding: "10px 14px", background: "#0f0f1a", border: "1px solid #3a3a5a", borderRadius: 8, color: "#e8e8f0", fontSize: 14, marginBottom: 12 }}
              />
              <button
                onClick={() => key.trim() && onSave(key.trim())}
                disabled={!key.trim()}
                style={{ width: "100%", padding: 12, background: key.trim() ? "#7c3aed" : "#2a2a4a", border: "none", borderRadius: 10, color: "#fff", fontWeight: 700, cursor: key.trim() ? "pointer" : "default", fontSize: 15 }}
              >Start Studying →</button>
            </Card>
          </div>
        </div>
      );
    }

    function Dashboard({ progress, n2Readiness, setSection }) {
      const sections = [
        { name: "Vocabulary", icon: "📖", color: "#7c3aed", desc: "AI flashcards" },
        { name: "Grammar", icon: "✏️", color: "#2563eb", desc: "Fill in blanks" },
        { name: "Listening", icon: "🎧", color: "#059669", desc: "Audio + quiz" },
        { name: "Reading", icon: "📰", color: "#d97706", desc: "Passages" },
        { name: "Speaking", icon: "🗣️", color: "#dc2626", desc: "Shadowing + feedback" },
        { name: "Mock Exam", icon: "📝", color: "#0891b2", desc: "Timed test" },
      ];
      const lastScore = progress.mockScores?.slice(-1)[0];
      return (
        <div>
          <Card>
            <div style={{ fontWeight: 700, fontSize: 18, marginBottom: 8 }}>N2 Readiness</div>
            <div style={{ background: "#0f0f1a", borderRadius: 8, height: 18, overflow: "hidden", marginBottom: 8 }}>
              <div style={{ height: "100%", width: `${n2Readiness}%`, background: "linear-gradient(90deg,#7c3aed,#a78bfa)", borderRadius: 8, transition: "width 0.5s" }} />
            </div>
            <div style={{ color: "#a78bfa", fontWeight: 700, fontSize: 22 }}>{n2Readiness}%</div>
            <div style={{ color: "#7070a0", fontSize: 12, marginTop: 4 }}>Every exercise is uniquely generated by Gemini AI 🤖</div>
          </Card>
          {lastScore && (
            <Card style={{ borderColor: "#0891b240" }}>
              <div style={{ fontWeight: 700, marginBottom: 4 }}>📝 Last Mock Exam</div>
              <div style={{ fontSize: 20, color: "#22d3ee", fontWeight: 700 }}>{lastScore.score}/{lastScore.total} · {Math.round(lastScore.score / lastScore.total * 100)}%</div>
              <div style={{ fontSize: 12, color: "#7070a0" }}>{lastScore.date}</div>
            </Card>
          )}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            {sections.map(s => (
              <div key={s.name} onClick={() => setSection(s.name)} style={{ background: "#1a1a2e", border: `1px solid ${s.color}40`, borderRadius: 12, padding: 16, cursor: "pointer", display: "flex", alignItems: "center", gap: 12 }}>
                <span style={{ fontSize: 28 }}>{s.icon}</span>
                <div>
                  <div style={{ fontWeight: 600, fontSize: 14 }}>{s.name}</div>
                  <div style={{ fontSize: 11, color: s.color }}>{s.desc}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function VocabSection({ apiKey, addXP }) {
      const [card, setCard] = React.useState(null);
      const [loading, setLoading] = React.useState(false);
      const [flipped, setFlipped] = React.useState(false);
      const [feedback, setFeedback] = React.useState(null);
      const [error, setError] = React.useState(null);
      const [topic, setTopic] = React.useState("daily life");
      const topics = ["daily life", "work & business", "nature", "technology", "health", "travel", "food", "emotions"];

      async function generate() {
        setLoading(true); setFlipped(false); setFeedback(null); setError(null);
        try {
          const data = await askGemini(apiKey, `Generate a JLPT N2 level Japanese vocabulary flashcard about the topic: "${topic}".
Return ONLY valid JSON:
{
  "kanji": "漢字",
  "reading": "ひらがな",
  "meaning": "English meaning",
  "example": "Example sentence in Japanese.",
  "example_translation": "English translation of example.",
  "level": "N2",
  "notes": "Brief grammar or usage note"
}`);
          setCard(data);
        } catch(e) { setError(e.message); }
        setLoading(false);
      }

      function rate(correct) {
        if (correct) addXP(10, "Vocabulary");
        setFeedback(correct ? "correct" : "wrong");
        setTimeout(() => generate(), 800);
      }

      React.useEffect(() => { generate(); }, []);

      return (
        <div>
          <h2 style={{ color: "#a78bfa", marginTop: 0 }}>📖 Vocabulary</h2>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16 }}>
            {topics.map(t => (
              <button key={t} onClick={() => setTopic(t)} style={{ padding: "4px 12px", borderRadius: 12, border: "none", background: topic === t ? "#7c3aed" : "#1e1e3a", color: topic === t ? "#fff" : "#9090c0", cursor: "pointer", fontSize: 12 }}>{t}</button>
            ))}
          </div>
          {error && <Card style={{ borderColor: "#ef444440" }}><div style={{ color: "#ef4444" }}>❌ {error}</div><button onClick={generate} style={{ marginTop: 8, padding: "6px 14px", background: "#7c3aed", border: "none", borderRadius: 8, color: "#fff", cursor: "pointer", fontSize: 13 }}>Retry</button></Card>}
          {loading ? <Spinner /> : card && (
            <>
              <div onClick={() => !feedback && setFlipped(!flipped)} style={{ background: feedback === "correct" ? "#064e3b" : feedback === "wrong" ? "#7f1d1d" : "#1a1a2e", border: `2px solid ${feedback === "correct" ? "#10b981" : feedback === "wrong" ? "#ef4444" : "#7c3aed"}`, borderRadius: 16, padding: 36, textAlign: "center", cursor: "pointer", minHeight: 200, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", transition: "all 0.3s", marginBottom: 16 }}>
                {!flipped ? (
                  <><div style={{ fontSize: 56, fontWeight: 700, marginBottom: 8 }}>{card.kanji}</div><div style={{ color: "#7070a0", fontSize: 13 }}>Tap to reveal</div></>
                ) : (
                  <>
                    <div style={{ fontSize: 40, fontWeight: 700, marginBottom: 4 }}>{card.kanji}</div>
                    <div style={{ fontSize: 20, color: "#a78bfa", marginBottom: 4 }}>{card.reading}</div>
                    <div style={{ fontSize: 16, marginBottom: 8 }}>{card.meaning}</div>
                    <div style={{ fontSize: 14, color: "#c0c0e0", marginBottom: 4, fontStyle: "italic" }}>{card.example}</div>
                    <div style={{ fontSize: 12, color: "#7070a0", marginBottom: 8 }}>{card.example_translation}</div>
                    {card.notes && <div style={{ fontSize: 12, color: "#fbbf24", background: "#0f0f1a", padding: "6px 12px", borderRadius: 8 }}>💡 {card.notes}</div>}
                  </>
                )}
              </div>
              {flipped && !feedback && (
                <div style={{ display: "flex", gap: 12 }}>
                  <button onClick={() => rate(false)} style={{ flex: 1, padding: 12, background: "#7f1d1d", border: "none", borderRadius: 10, color: "#fca5a5", fontWeight: 700, cursor: "pointer", fontSize: 15 }}>✗ Didn't know</button>
                  <button onClick={() => rate(true)} style={{ flex: 1, padding: 12, background: "#064e3b", border: "none", borderRadius: 10, color: "#6ee7b7", fontWeight: 700, cursor: "pointer", fontSize: 15 }}>✓ Got it! +10 XP</button>
                </div>
              )}
              {!flipped && (
                <div style={{ display: "flex", gap: 10 }}>
                  <button onClick={() => setFlipped(true)} style={{ flex: 2, padding: 12, background: "#7c3aed", border: "none", borderRadius: 10, color: "#fff", fontWeight: 700, cursor: "pointer" }}>Reveal</button>
                  <button onClick={generate} style={{ flex: 1, padding: 12, background: "#1e1e3a", border: "1px solid #3a3a5a", borderRadius: 10, color: "#9090c0", fontWeight: 600, cursor: "pointer" }}>Skip →</button>
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    function GrammarSection({ apiKey, addXP }) {
      const [item, setItem] = React.useState(null);
      const [loading, setLoading] = React.useState(false);
      const [selected, setSelected] = React.useState(null);
      const [showResult, setShowResult] = React.useState(false);
      const [error, setError] = React.useState(null);

      async function generate() {
        setLoading(true); setSelected(null); setShowResult(false); setError(null);
        try {
          const data = await askGemini(apiKey, `Generate a JLPT N2 grammar exercise.
Return ONLY valid JSON:
{
  "pattern": "〜grammar pattern",
  "meaning": "English meaning",
  "example": "Example sentence in Japanese using this pattern.",
  "example_translation": "English translation.",
  "quiz": "Sentence with ___ where the pattern should go (in Japanese)",
  "answer": "correct option",
  "options": ["correct option", "wrong option 1", "wrong option 2", "wrong option 3"],
  "explanation": "Brief explanation of why the answer is correct"
}
Make sure options are shuffled. All 4 options must be plausible N2 grammar patterns.`);
          setItem(data);
        } catch(e) { setError(e.message); }
        setLoading(false);
      }

      function select(opt) {
        if (showResult) return;
        setSelected(opt); setShowResult(true);
        if (opt === item.answer) addXP(15, "Grammar");
      }

      React.useEffect(() => { generate(); }, []);

      return (
        <div>
          <h2 style={{ color: "#60a5fa", marginTop: 0 }}>✏️ Grammar</h2>
          {error && <Card style={{ borderColor: "#ef444440" }}><div style={{ color: "#ef4444" }}>❌ {error}</div><button onClick={generate} style={{ marginTop: 8, padding: "6px 14px", background: "#2563eb", border: "none", borderRadius: 8, color: "#fff", cursor: "pointer", fontSize: 13 }}>Retry</button></Card>}
          {loading ? <Spinner /> : item && (
            <>
              <Card>
                <div style={{ fontSize: 20, fontWeight: 700, color: "#60a5fa", marginBottom: 4 }}>{item.pattern}</div>
                <div style={{ color: "#c0c0e0", marginBottom: 4 }}>{item.meaning}</div>
                <div style={{ fontSize: 15, marginBottom: 2 }}>{item.example}</div>
                <div style={{ fontSize: 13, color: "#7070a0" }}>{item.example_translation}</div>
              </Card>
              <Card>
                <div style={{ fontWeight: 600, marginBottom: 12 }}>Fill in the blank:</div>
                <div style={{ fontSize: 18, marginBottom: 16, padding: 12, background: "#0f0f1a", borderRadius: 8, lineHeight: 1.8 }}>{item.quiz}</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                  {item.options.map(opt => {
                    let bg = "#1e1e3a", border = "#2a2a4a";
                    if (showResult) { if (opt === item.answer) { bg = "#064e3b"; border = "#10b981"; } else if (opt === selected && opt !== item.answer) { bg = "#7f1d1d"; border = "#ef4444"; } }
                    return <button key={opt} onClick={() => select(opt)} style={{ padding: 10, background: bg, border: `1px solid ${border}`, borderRadius: 8, color: "#e8e8f0", cursor: showResult ? "default" : "pointer", fontSize: 14, fontWeight: 500 }}>{opt}</button>;
                  })}
                </div>
                {showResult && (
                  <div style={{ marginTop: 12 }}>
                    <div style={{ padding: 10, background: selected === item.answer ? "#064e3b" : "#7f1d1d", borderRadius: 8, fontSize: 14, marginBottom: 8 }}>{selected === item.answer ? "✅ Correct! +15 XP" : `❌ Correct: ${item.answer}`}</div>
                    {item.explanation && <div style={{ padding: 10, background: "#0f0f1a", borderRadius: 8, fontSize: 13, color: "#fbbf24" }}>💡 {item.explanation}</div>}
                  </div>
                )}
              </Card>
              {showResult && <button onClick={generate} style={{ width: "100%", padding: 12, background: "#2563eb", border: "none", borderRadius: 10, color: "#fff", fontWeight: 700, cursor: "pointer" }}>Next Pattern →</button>}
            </>
          )}
        </div>
      );
    }

    function ListeningSection({ apiKey, addXP }) {
      const [item, setItem] = React.useState(null);
      const [loading, setLoading] = React.useState(false);
      const [playing, setPlaying] = React.useState(false);
      const [selected, setSelected] = React.useState(null);
      const [showResult, setShowResult] = React.useState(false);
      const [revealed, setRevealed] = React.useState(false);
      const [error, setError] = React.useState(null);

      async function generate() {
        setLoading(true); setSelected(null); setShowResult(false); setRevealed(false); setError(null);
        try {
          const data = await askGemini(apiKey, `Generate a JLPT N2 listening comprehension exercise.
Return ONLY valid JSON:
{
  "scenario": "Brief description of the situation in English",
  "script": "The Japanese audio script (2-4 sentences, natural spoken style)",
  "question": "Comprehension question in Japanese",
  "options": ["option 1 in Japanese", "option 2 in Japanese", "option 3 in Japanese", "option 4 in Japanese"],
  "answer": 0,
  "explanation": "Why the answer is correct (in English)"
}
answer is the index (0-3) of the correct option.`);
          setItem(data);
        } catch(e) { setError(e.message); }
        setLoading(false);
      }

      function speak() {
        if (!window.speechSynthesis || !item) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(item.script);
        u.lang = "ja-JP"; u.rate = 0.85;
        u.onstart = () => setPlaying(true); u.onend = () => setPlaying(false);
        window.speechSynthesis.speak(u);
      }

      function select(i) {
        if (showResult) return;
        setSelected(i); setShowResult(true);
        if (i === item.answer) addXP(20, "Listening");
      }

      React.useEffect(() => { generate(); }, []);

      return (
        <div>
          <h2 style={{ color: "#34d399", marginTop: 0 }}>🎧 Listening</h2>
          {error && <Card style={{ borderColor: "#ef444440" }}><div style={{ color: "#ef4444" }}>❌ {error}</div><button onClick={generate} style={{ marginTop: 8, padding: "6px 14px", background: "#059669", border: "none", borderRadius: 8, color: "#fff", cursor: "pointer", fontSize: 13 }}>Retry</button></Card>}
          {loading ? <Spinner /> : item && (
            <>
              <Card>
                <div style={{ color: "#7070a0", fontSize: 13, marginBottom: 12 }}>📍 {item.scenario}</div>
                <div style={{ textAlign: "center", marginBottom: 8 }}>
                  <button onClick={speak} disabled={playing} style={{ padding: "12px 28px", background: playing ? "#1e4a3a" : "#059669", border: "none", borderRadius: 30, color: "#fff", fontWeight: 700, cursor: playing ? "default" : "pointer", fontSize: 15 }}>{playing ? "🔊 Playing..." : "▶ Play Audio"}</button>
                </div>
                <div style={{ textAlign: "center" }}>
                  <button onClick={() => setRevealed(!revealed)} style={{ padding: "4px 14px", background: "#1e1e3a", border: "1px solid #3a3a5a", borderRadius: 8, color: "#7070a0", cursor: "pointer", fontSize: 12 }}>{revealed ? "Hide" : "Show"} transcript</button>
                </div>
                {revealed && <div style={{ marginTop: 10, padding: 10, background: "#0f0f1a", borderRadius: 8, fontSize: 14, color: "#c0c0e0", lineHeight: 1.8 }}>{item.script}</div>}
              </Card>
              <Card>
                <div style={{ fontWeight: 600, marginBottom: 12, fontSize: 15 }}>{item.question}</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {item.options.map((opt, i) => {
                    let bg = "#1e1e3a", border = "#2a2a4a";
                    if (showResult) { if (i === item.answer) { bg = "#064e3b"; border = "#10b981"; } else if (i === selected && i !== item.answer) { bg = "#7f1d1d"; border = "#ef4444"; } }
                    return <button key={i} onClick={() => select(i)} style={{ padding: 10, background: bg, border: `1px solid ${border}`, borderRadius: 8, color: "#e8e8f0", cursor: showResult ? "default" : "pointer", fontSize: 14, textAlign: "left" }}>{i + 1}. {opt}</button>;
                  })}
                </div>
                {showResult && (
                  <div style={{ marginTop: 10 }}>
                    <div style={{ padding: 10, background: selected === item.answer ? "#064e3b" : "#7f1d1d", borderRadius: 8, fontSize: 14, marginBottom: 8 }}>{selected === item.answer ? "✅ Correct! +20 XP" : `❌ Correct: ${item.options[item.answer]}`}</div>
                    {item.explanation && <div style={{ padding: 10, background: "#0f0f1a", borderRadius: 8, fontSize: 13, color: "#fbbf24" }}>💡 {item.explanation}</div>}
                  </div>
                )}
              </Card>
              {showResult && <button onClick={generate} style={{ width: "100%", padding: 12, background: "#059669", border: "none", borderRadius: 10, color: "#fff", fontWeight: 700, cursor: "pointer" }}>Next Clip →</button>}
            </>
          )}
        </div>
      );
    }

    function ReadingSection({ apiKey, addXP }) {
      const [item, setItem] = React.useState(null);
      const [loading, setLoading] = React.useState(false);
      const [qIdx, setQIdx] = React.useState(0);
      const [selected, setSelected] = React.useState(null);
      const [showResult, setShowResult] = React.useState(false);
      const [error, setError] = React.useState(null);
      const [topic, setTopic] = React.useState("society");
      const topics = ["society", "environment", "technology", "health", "culture", "work", "education", "science"];

      async function generate() {
        setLoading(true); setQIdx(0); setSelected(null); setShowResult(false); setError(null);
        try {
          const data = await askGemini(apiKey, `Generate a JLPT N2 reading comprehension passage about: "${topic}".
Return ONLY valid JSON:
{
  "title": "Title in Japanese",
  "passage": "A 100-150 word passage in Japanese at N2 level.",
  "questions": [
    { "q": "Question in Japanese", "options": ["A","B","C","D"], "answer": 0, "explanation": "English explanation" },
    { "q": "Second question in Japanese", "options": ["A","B","C","D"], "answer": 1, "explanation": "English explanation" }
  ]
}
answer is the index (0-3) of the correct option.`);
          setItem(data);
        } catch(e) { setError(e.message); }
        setLoading(false);
      }

      function select(i) {
        if (showResult) return;
        setSelected(i); setShowResult(true);
        if (i === item.questions[qIdx].answer) addXP(20, "Reading");
      }

      function next() {
        if (qIdx < item.questions.length - 1) { setQIdx(qIdx + 1); setSelected(null); setShowResult(false); }
        else generate();
      }

      React.useEffect(() => { generate(); }, []);
      const q = item?.questions?.[qIdx];

      return (
        <div>
          <h2 style={{ color: "#fbbf24", marginTop: 0 }}>📰 Reading</h2>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16 }}>
            {topics.map(t => (
              <button key={t} onClick={() => setTopic(t)} style={{ padding: "4px 12px", borderRadius: 12, border: "none", background: topic === t ? "#d97706" : "#1e1e3a", color: topic === t ? "#fff" : "#9090c0", cursor: "pointer", fontSize: 12 }}>{t}</button>
            ))}
          </div>
          {error && <Card style={{ borderColor: "#ef444440" }}><div style={{ color: "#ef4444" }}>❌ {error}</div><button onClick={generate} style={{ marginTop: 8, padding: "6px 14px", background: "#d97706", border: "none", borderRadius: 8, color: "#fff", cursor: "pointer", fontSize: 13 }}>Retry</button></Card>}
          {loading ? <Spinner /> : item && q && (
            <>
              <Card>
                <div style={{ fontWeight: 700, color: "#fbbf24", marginBottom: 10, fontSize: 16 }}>{item.title}</div>
                <div style={{ fontSize: 15, lineHeight: 2, color: "#d0d0e8" }}>{item.passage}</div>
              </Card>
              <Card>
                <div style={{ color: "#7070a0", fontSize: 12, marginBottom: 8 }}>問題 {qIdx + 1}/{item.questions.length}</div>
                <div style={{ fontWeight: 600, marginBottom: 12 }}>{q.q}</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {q.options.map((opt, i) => {
                    let bg = "#1e1e3a", border = "#2a2a4a";
                    if (showResult) { if (i === q.answer) { bg = "#064e3b"; border = "#10b981"; } else if (i === selected && i !== q.answer) { bg = "#7f1d1d"; border = "#ef4444"; } }
                    return <button key={i} onClick={() => select(i)} style={{ padding: 10, background: bg, border: `1px solid ${border}`, borderRadius: 8, color: "#e8e8f0", cursor: showResult ? "default" : "pointer", fontSize: 14, textAlign: "left" }}>{i + 1}. {opt}</button>;
                  })}
                </div>
                {showResult && (
                  <div style={{ marginTop: 10 }}>
                    <div style={{ padding: 10, background: selected === q.answer ? "#064e3b" : "#7f1d1d", borderRadius: 8, fontSize: 14, marginBottom: 8 }}>{selected === q.answer ? "✅ Correct! +20 XP" : `❌ Correct: ${q.options[q.answer]}`}</div>
                    {q.explanation && <div style={{ padding: 10, background: "#0f0f1a", borderRadius: 8, fontSize: 13, color: "#fbbf24" }}>💡 {q.explanation}</div>}
                  </div>
                )}
              </Card>
              {showResult && <button onClick={next} style={{ width: "100%", padding: 12, background: "#d97706", border: "none", borderRadius: 10, color: "#fff", fontWeight: 700, cursor: "pointer" }}>{qIdx < item.questions.length - 1 ? "Next Question →" : "New Passage →"}</button>}
            </>
          )}
        </div>
      );
    }

    function SpeakingSection({ apiKey, addXP }) {
      const [item, setItem] = React.useState(null);
      const [loading, setLoading] = React.useState(false);
      const [playing, setPlaying] = React.useState(false);
      const [userAnswer, setUserAnswer] = React.useState("");
      const [feedback, setFeedback] = React.useState(null);
      const [evaluating, setEvaluating] = React.useState(false);
      const [error, setError] = React.useState(null);

      async function generate() {
        setLoading(true); setFeedback(null); setUserAnswer(""); setError(null);
        try {
          const data = await askGemini(apiKey, `Generate a JLPT N2 speaking/shadowing exercise.
Return ONLY valid JSON:
{
  "japanese": "A natural Japanese sentence at N2 level (1-2 sentences)",
  "romaji": "Romaji pronunciation guide",
  "english": "English translation",
  "grammar_point": "The key N2 grammar or expression used",
  "tip": "Pronunciation or grammar tip"
}`);
          setItem(data);
        } catch(e) { setError(e.message); }
        setLoading(false);
      }

      async function evaluate() {
        if (!userAnswer.trim()) return;
        setEvaluating(true);
        try {
          const fb = await askGemini(apiKey, `A Japanese learner studying for JLPT N2 is practicing:
"${item.japanese}"
Their attempt/notes: "${userAnswer}"
Return ONLY valid JSON:
{
  "score": 7,
  "comment": "Encouraging feedback in 1-2 sentences",
  "correction": "Corrected version if needed, or null",
  "tip": "One specific improvement tip"
}`);
          setFeedback(fb);
          if (fb.score >= 6) addXP(15, "Speaking");
        } catch(e) { setError(e.message); }
        setEvaluating(false);
      }

      function speak() {
        if (!window.speechSynthesis || !item) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(item.japanese);
        u.lang = "ja-JP"; u.rate = 0.8;
        u.onstart = () => setPlaying(true); u.onend = () => setPlaying(false);
        window.speechSynthesis.speak(u);
      }

      React.useEffect(() => { generate(); }, []);

      return (
        <div>
          <h2 style={{ color: "#f87171", marginTop: 0 }}>🗣️ Speaking + AI Feedback</h2>
          {error && <Card style={{ borderColor: "#ef444440" }}><div style={{ color: "#ef4444" }}>❌ {error}</div></Card>}
          {loading ? <Spinner /> : item && (
            <>
              <Card>
                <div style={{ fontSize: 22, fontWeight: 700, marginBottom: 8, lineHeight: 1.6 }}>{item.japanese}</div>
                <div style={{ color: "#a78bfa", marginBottom: 4, fontSize: 14 }}>{item.romaji}</div>
                <div style={{ color: "#7070a0", fontSize: 13, marginBottom: 12 }}>{item.english}</div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <div style={{ background: "#0f0f1a", borderRadius: 8, padding: "6px 12px", fontSize: 12, color: "#60a5fa" }}>🔑 {item.grammar_point}</div>
                  <div style={{ background: "#0f0f1a", borderRadius: 8, padding: "6px 12px", fontSize: 12, color: "#fbbf24" }}>💡 {item.tip}</div>
                </div>
              </Card>
              <button onClick={speak} disabled={playing} style={{ width: "100%", padding: 12, background: playing ? "#1e1e3a" : "#7c3aed", border: "none", borderRadius: 10, color: "#fff", fontWeight: 700, cursor: playing ? "default" : "pointer", fontSize: 15, marginBottom: 16 }}>{playing ? "🔊 Listen & shadow..." : "▶ Play & Shadow"}</button>
              {!feedback ? (
                <Card>
                  <div style={{ fontWeight: 600, marginBottom: 8 }}>Type your attempt or notes:</div>
                  <textarea value={userAnswer} onChange={e => setUserAnswer(e.target.value)} placeholder="e.g. I said it correctly / I struggled with the て-form / 私は..." style={{ width: "100%", padding: 10, background: "#0f0f1a", border: "1px solid #3a3a5a", borderRadius: 8, color: "#e8e8f0", fontSize: 14, minHeight: 80, resize: "vertical", marginBottom: 10 }} />
                  <button onClick={evaluate} disabled={evaluating || !userAnswer.trim()} style={{ width: "100%", padding: 12, background: evaluating ? "#1e1e3a" : "#dc2626", border: "none", borderRadius: 10, color: "#fff", fontWeight: 700, cursor: evaluating ? "default" : "pointer" }}>{evaluating ? "Evaluating..." : "Get AI Feedback →"}</button>
                </Card>
              ) : (
                <>
                  <Card style={{ borderColor: feedback.score >= 7 ? "#10b98140" : "#f59e0b40" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                      <div style={{ fontWeight: 700 }}>AI Feedback</div>
                      <div style={{ fontSize: 20, fontWeight: 700, color: feedback.score >= 7 ? "#10b981" : "#f59e0b" }}>{feedback.score}/10</div>
                    </div>
                    <div style={{ color: "#c0c0e0", marginBottom: 8 }}>{feedback.comment}</div>
                    {feedback.correction && <div style={{ padding: 10, background: "#0f0f1a", borderRadius: 8, fontSize: 14, marginBottom: 8, color: "#a78bfa" }}>✍️ {feedback.correction}</div>}
                    <div style={{ padding: 10, background: "#0f0f1a", borderRadius: 8, fontSize: 13, color: "#fbbf24" }}>💡 {feedback.tip}</div>
                    {feedback.score >= 6 && <div style={{ marginTop: 8, color: "#10b981", fontSize: 13 }}>+15 XP earned!</div>}
                  </Card>
                  <button onClick={generate} style={{ width: "100%", padding: 12, background: "#dc2626", border: "none", borderRadius: 10, color: "#fff", fontWeight: 700, cursor: "pointer" }}>Next Sentence →</button>
                </>
              )}
            </>
          )}
        </div>
      );
    }

    function MockExam({ apiKey, addXP, addMockScore, progress }) {
      const [started, setStarted] = React.useState(false);
      const [questions, setQuestions] = React.useState([]);
      const [loading, setLoading] = React.useState(false);
      const [qIdx, setQIdx] = React.useState(0);
      const [answers, setAnswers] = React.useState({});
      const [finished, setFinished] = React.useState(false);
      const [timeLeft, setTimeLeft] = React.useState(900);
      const [error, setError] = React.useState(null);
      const timerRef = React.useRef(null);

      React.useEffect(() => {
        if (started && !finished && questions.length > 0) {
          timerRef.current = setInterval(() => {
            setTimeLeft(t => { if (t <= 1) { clearInterval(timerRef.current); setFinished(true); return 0; } return t - 1; });
          }, 1000);
        }
        return () => clearInterval(timerRef.current);
      }, [started, finished, questions]);

      async function startExam() {
        setLoading(true); setError(null);
        try {
          const data = await askGemini(apiKey, `Generate a JLPT N2 mock exam with exactly 10 questions. Mix vocabulary (3), grammar (3), listening (2), reading (2).
Return ONLY valid JSON array:
[{ "type": "vocabulary", "question": "...", "script": null, "passage": null, "options": ["A","B","C","D"], "answer": 0 }]
For listening set "script" to a short Japanese audio script.
For reading set "passage" to a short Japanese passage.
answer is the index (0-3) of the correct option. Make questions genuinely N2 level.`);
          setQuestions(data);
          setQIdx(0); setAnswers({}); setFinished(false); setTimeLeft(900);
          setStarted(true);
        } catch(e) { setError(e.message); }
        setLoading(false);
      }

      function answer(i) {
        if (answers[qIdx] !== undefined) return;
        const newAns = { ...answers, [qIdx]: i };
        setAnswers(newAns);
        if (qIdx < questions.length - 1) setTimeout(() => setQIdx(qIdx + 1), 500);
        else {
          clearInterval(timerRef.current);
          const score = questions.reduce((s, q, idx) => s + (newAns[idx] === q.answer ? 1 : 0), 0);
          addMockScore(score, questions.length);
          addXP(score * 10, "Mock Exam");
          setFinished(true);
        }
      }

      function speakScript(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "ja-JP"; u.rate = 0.85;
        window.speechSynthesis.speak(u);
      }

      if (!started && !loading) return (
        <div>
          <h2 style={{ color: "#22d3ee", marginTop: 0 }}>📝 Mock JLPT Exam</h2>
          {error && <Card style={{ borderColor: "#ef444440" }}><div style={{ color: "#ef4444" }}>❌ {error}</div></Card>}
          <Card>
            <div style={{ fontWeight: 700, fontSize: 18, marginBottom: 8 }}>AI-Generated N2 Practice Exam</div>
            <div style={{ color: "#c0c0e0", lineHeight: 1.8, marginBottom: 16 }}>• 10 unique AI-generated questions<br />• 15 minute time limit<br />• Vocabulary, Grammar, Listening & Reading<br />• Every exam is different!</div>
            {progress.mockScores?.slice(-3).map((s, i) => (
              <div key={i} style={{ fontSize: 13, color: "#7070a0", marginBottom: 4 }}>{s.date}: {s.score}/{s.total} ({Math.round(s.score/s.total*100)}%)</div>
            ))}
            <button onClick={startExam} style={{ width: "100%", padding: 14, background: "#0891b2", border: "none", borderRadius: 10, color: "#fff", fontWeight: 700, cursor: "pointer", fontSize: 16, marginTop: 12 }}>Generate & Start Exam →</button>
          </Card>
        </div>
      );

      if (loading) return <div><h2 style={{ color: "#22d3ee", marginTop: 0 }}>📝 Mock Exam</h2><Spinner /></div>;

      if (finished) {
        const score = questions.reduce((s, q, i) => s + (answers[i] === q.answer ? 1 : 0), 0);
        const pct = Math.round(score / questions.length * 100);
        return (
          <div>
            <h2 style={{ color: "#22d3ee", marginTop: 0 }}>📝 Results</h2>
            <Card style={{ textAlign: "center" }}>
              <div style={{ fontSize: 48, marginBottom: 8 }}>{pct >= 70 ? "🎉" : pct >= 50 ? "😊" : "😅"}</div>
              <div style={{ fontSize: 36, fontWeight: 700, color: "#22d3ee" }}>{score}/{questions.length}</div>
              <div style={{ fontSize: 20, color: "#7070a0", marginBottom: 8 }}>{pct}%</div>
              <div style={{ color: "#c0c0e0", marginBottom: 12 }}>{pct >= 70 ? "Excellent! N2 is within reach!" : pct >= 50 ? "Good progress! Keep practicing." : "Keep going — consistency is key!"}</div>
              <div style={{ color: "#a78bfa", marginBottom: 16 }}>+{score * 10} XP earned</div>
            </Card>
            {questions.map((q, i) => (
              <div key={i} style={{ padding: "8px 12px", background: answers[i] === q.answer ? "#064e3b33" : "#7f1d1d33", borderRadius: 8, marginBottom: 6, fontSize: 13, borderLeft: `3px solid ${answers[i] === q.answer ? "#10b981" : "#ef4444"}` }}>
                <span style={{ color: answers[i] === q.answer ? "#10b981" : "#ef4444" }}>{answers[i] === q.answer ? "✓" : "✗"}</span> [{q.type}] {q.question?.slice(0, 60)}
              </div>
            ))}
            <button onClick={() => setStarted(false)} style={{ width: "100%", padding: 12, background: "#0891b2", border: "none", borderRadius: 10, color: "#fff", fontWeight: 700, cursor: "pointer", marginTop: 8 }}>New Exam</button>
          </div>
        );
      }

      const q = questions[qIdx];
      const mins = Math.floor(timeLeft / 60);
      const secs = timeLeft % 60;

      return (
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <h2 style={{ color: "#22d3ee", margin: 0 }}>📝 Mock Exam</h2>
            <div style={{ color: timeLeft < 120 ? "#ef4444" : "#22d3ee", fontWeight: 700, fontSize: 18 }}>⏱ {mins}:{secs.toString().padStart(2, "0")}</div>
          </div>
          <div style={{ background: "#0f0f1a", borderRadius: 8, height: 6, marginBottom: 16 }}>
            <div style={{ height: "100%", width: `${(qIdx + 1) / questions.length * 100}%`, background: "#22d3ee", borderRadius: 8, transition: "width 0.3s" }} />
          </div>
          <div style={{ color: "#7070a0", fontSize: 13, marginBottom: 12 }}>Q{qIdx + 1}/{questions.length} · {q.type?.toUpperCase()}</div>
          <Card>
            {q.script && <div style={{ marginBottom: 12 }}><button onClick={() => speakScript(q.script)} style={{ padding: "8px 20px", background: "#059669", border: "none", borderRadius: 20, color: "#fff", fontWeight: 700, cursor: "pointer" }}>▶ Listen</button></div>}
            {q.passage && <div style={{ fontSize: 14, lineHeight: 1.8, color: "#d0d0e8", marginBottom: 12, padding: 12, background: "#0f0f1a", borderRadius: 8 }}>{q.passage}</div>}
            <div style={{ fontWeight: 600, marginBottom: 12, fontSize: 16 }}>{q.question}</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {q.options.map((opt, i) => {
                let bg = "#1e1e3a", border = "#2a2a4a";
                if (answers[qIdx] !== undefined) { if (i === q.answer) { bg = "#064e3b"; border = "#10b981"; } else if (i === answers[qIdx] && i !== q.answer) { bg = "#7f1d1d"; border = "#ef4444"; } }
                return <button key={i} onClick={() => answer(i)} style={{ padding: 10, background: bg, border: `1px solid ${border}`, borderRadius: 8, color: "#e8e8f0", cursor: answers[qIdx] !== undefined ? "default" : "pointer", fontSize: 14, textAlign: "left" }}>{i + 1}. {opt}</button>;
              })}
            </div>
          </Card>
        </div>
      );
    }

    function App() {
      const [apiKey, setApiKey] = React.useState(() => localStorage.getItem("jlpt_apikey") || "");
      const [section, setSection] = React.useState("Dashboard");
      const [progress, setProgress] = React.useState(() => load() || initProgress());

      React.useEffect(() => { save(progress); }, [progress]);

      function saveKey(k) { localStorage.setItem("jlpt_apikey", k); setApiKey(k); }

      function addXP(amount, sec) {
        setProgress(p => {
          const today = new Date().toDateString();
          const streak = p.lastStudied === today ? p.streak : (p.lastStudied === new Date(Date.now()-86400000).toDateString() ? p.streak+1 : 1);
          return { ...p, xp: p.xp+amount, streak, lastStudied: today, sectionXP: { ...p.sectionXP, [sec]: (p.sectionXP[sec]||0)+amount } };
        });
      }

      function addMockScore(score, total) {
        setProgress(p => ({ ...p, mockScores: [...(p.mockScores||[]), { score, total, date: new Date().toLocaleDateString() }] }));
      }

      if (!apiKey) return <ApiKeySetup onSave={saveKey} />;

      const n2Readiness = Math.min(100, Math.round(progress.xp / 20));

      return (
        <div style={{ fontFamily: "'Segoe UI', sans-serif", minHeight: "100vh", background: "#0f0f1a", color: "#e8e8f0" }}>
          <div style={{ background: "linear-gradient(135deg,#1a1a2e,#16213e)", borderBottom: "1px solid #2a2a4a", padding: "12px 20px", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ fontSize: 24 }}>🎌</span>
              <div>
                <div style={{ fontWeight: 700, fontSize: 16, color: "#a78bfa" }}>JLPT N3→N2</div>
                <div style={{ fontSize: 11, color: "#34d399" }}>✨ Gemini AI Powered</div>
              </div>
            </div>
            <div style={{ display: "flex", gap: 12, fontSize: 13, flexWrap: "wrap", alignItems: "center" }}>
              <span>⚡ {progress.xp} XP</span>
              <span>🔥 {progress.streak} day streak</span>
              <span>📊 {n2Readiness}% N2 ready</span>
              <button onClick={() => { localStorage.removeItem("jlpt_apikey"); setApiKey(""); }} style={{ padding: "3px 10px", background: "#1e1e3a", border: "1px solid #3a3a5a", borderRadius: 8, color: "#7070a0", cursor: "pointer", fontSize: 11 }}>Change Key</button>
            </div>
          </div>
          <div style={{ display: "flex", gap: 4, padding: "10px 20px", background: "#12122a", overflowX: "auto" }}>
            {SECTIONS.map(s => (
              <button key={s} onClick={() => setSection(s)} style={{ padding: "6px 14px", borderRadius: 20, border: "none", cursor: "pointer", fontSize: 12, fontWeight: 600, background: section === s ? "#7c3aed" : "#1e1e3a", color: section === s ? "#fff" : "#9090c0", whiteSpace: "nowrap" }}>{s}</button>
            ))}
          </div>
          <div style={{ padding: "20px", maxWidth: 800, margin: "0 auto" }}>
            {section === "Dashboard" && <Dashboard progress={progress} n2Readiness={n2Readiness} setSection={setSection} />}
            {section === "Vocabulary" && <VocabSection apiKey={apiKey} addXP={addXP} />}
            {section === "Grammar" && <GrammarSection apiKey={apiKey} addXP={addXP} />}
            {section === "Listening" && <ListeningSection apiKey={apiKey} addXP={addXP} />}
            {section === "Reading" && <ReadingSection apiKey={apiKey} addXP={addXP} />}
            {section === "Speaking" && <SpeakingSection apiKey={apiKey} addXP={addXP} />}
            {section === "Mock Exam" && <MockExam apiKey={apiKey} addXP={addXP} addMockScore={addMockScore} progress={progress} />}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
